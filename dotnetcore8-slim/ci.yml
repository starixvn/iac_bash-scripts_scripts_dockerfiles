.dotnetcore8-slim:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "dotnetcore8-slim/**/*"
    DIR_PATH: "dotnetcore8-slim"
    IMAGE_VERSION: "8.0-slim"
    IMAGE_TAG: "8.0-bookworm-slim"
    BASE_IMAGE: "mcr.microsoft.com/dotnet/aspnet:$IMAGE_TAG"
    # IMAGE_PATH: "rebuild-baseimage/dotnetcore/aspnet:$IMAGE_VERSION"
    IMAGE_PATH: "base/dotnet/core/aspnet:$IMAGE_VERSION"

dotnetcore8-slim-test:
  extends: [.dotnetcore8-slim, .test]

dotnetcore8-slim-build:
  extends: [.dotnetcore8-slim, .build]
  needs: ["dotnetcore8-slim-test"]

dotnetcore8-slim-config-scan-reports:
  extends: [.defectdojo_upload, .dotnetcore8-slim]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "Dockerfile Scan"
  needs:
    - job: dotnetcore8-slim-test
      artifacts: true
  when: always


dotnetcore8-slim-image-scan-reports:
  extends: [.defectdojo_upload, .dotnetcore8-slim]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$IMAGE_PATH - Image Scan"
  needs:
    - job: dotnetcore8-slim-build
      artifacts: true
  when: always