##HA-PROXY-TOOL
.haproxy:
  extends: .base-rules
  variables:
      RULES_CHANGES_PATH: "haproxy/**/*"
      base_img: haproxy/haproxy-ubuntu:2.6
      packages: nano curl telnet

haproxy-test:
  extends: .haproxy
  <<: *test

haproxy-build:
  extends: .haproxy
  needs: ["haproxy-test"]
  <<: *build

haproxy-deploy:
  extends: .haproxy
  needs: ["haproxy-build"]
  <<: *deploy
