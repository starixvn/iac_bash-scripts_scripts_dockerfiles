.haproxy-ci:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "haproxy-ci/**/*"
    DIR_PATH: "haproxy-ci"
    BASE_IMAGE: "haproxytech/haproxy-ubuntu:$IMAGE_VERSION"
    IMAGE_VERSION: "3.1"
    IMAGE_VERSION_CUS: "3.1-ci"
    IMAGE_PATH: "base/haproxy/haproxy-ubuntu:$IMAGE_VERSION_CUS"
    
haproxy-ci-test:
  extends: [.haproxy-ci, .test]

haproxy-ci-build:
  extends: [.haproxy-ci, .build]
  needs: ["haproxy-ci-test"]

haproxy-ci-config-scan-reports:
  extends: [.defectdojo_upload, .haproxy-ci]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Config Scan"
  needs:
    - job: haproxy-ci-test
      artifacts: true
  when: always


haproxy-ci-image-scan-reports:
  extends: [.defectdojo_upload, .haproxy-ci]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Image Scan"
  needs:
    - job: haproxy-ci-build
      artifacts: true
  when: always