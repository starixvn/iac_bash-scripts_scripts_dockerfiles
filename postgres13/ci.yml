.postgres13:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "postgres13/**/*"
    DIR_PATH: "postgres13"
    BASE_IMAGE: "postgres:$IMAGE_VERSION"
    IMAGE_VERSION: "13.11"
    IMAGE_PATH: "base/postgres:$IMAGE_VERSION"
    
postgres13-test:
  extends: [.postgres13, .test]

postgres13-build:
  extends: [.postgres13, .build]
  needs: ["postgres13-test"]

postgres13-config-scan-reports:
  extends: [.defectdojo_upload, .postgres13]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "Dockerfile Scan"
  needs:
    - job: postgres13-test
      artifacts: true
  when: always


postgres13-image-scan-reports:
  extends: [.defectdojo_upload, .postgres13]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$IMAGE_PATH - Image Scan"
  needs:
    - job: postgres13-build
      artifacts: true
  when: always