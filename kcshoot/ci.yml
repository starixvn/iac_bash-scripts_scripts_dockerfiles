.kcshoot:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "kcshoot/**/*"
    DIR_PATH: "kcshoot"
    IMAGE_VERSION: "latest"
    BASE_IMAGE: "alpine:3.20.3"
    IMAGE_PATH: "base/kcshoot:$IMAGE_VERSION"

kcshoot-test:
  extends: [.kcshoot, .test]

kcshoot-build:
  extends: [.kcshoot, .build]
  needs: ["kcshoot-test"]