.kcshoot-kbt:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "kcshoot-kbt/**/*"
    DIR_PATH: "kcshoot-kbt"
    IMAGE_VERSION: "kbt"
    BASE_IMAGE: "alpine:3.20.3"
    IMAGE_PATH: "base/kcshoot:$IMAGE_VERSION"

kcshoot-kbt-test:
  extends: [.kcshoot-kbt, .test]

kcshoot-kbt-build:
  extends: [.kcshoot-kbt, .build]
  needs: ["kcshoot-kbt-test"]

kcshoot-kbt-config-scan-reports:
  extends: [.defectdojo_upload, .kcshoot-kbt]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Config Scan"
  needs:
    - job: kcshoot-kbt-test
      artifacts: true
  when: always


kcshoot-kbt-image-scan-reports:
  extends: [.defectdojo_upload, .kcshoot-kbt]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Image Scan"
  needs:
    - job: kcshoot-kbt-build
      artifacts: true
  when: always