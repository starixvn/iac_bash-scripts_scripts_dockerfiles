.zabbix-server-pgsql:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "zabbix-server-pgsql/**/*"
    DIR_PATH: "zabbix-server-pgsql"
    BASE_IMAGE: "zabbix/zabbix-server-pgsql:$IMAGE_VERSION"
    IMAGE_VERSION: "ubuntu-5.4.12"
    IMAGE_PATH: "base/zabbix/zabbix-server-pgsql:$IMAGE_VERSION"
    
zabbix-server-pgsql-test:
  extends: [.zabbix-server-pgsql, .test]

zabbix-server-pgsql-build:
  extends: [.zabbix-server-pgsql, .build]
  needs: ["zabbix-server-pgsql-test"]

zabbix-server-pgsql-config-scan-reports:
  extends: [.defectdojo_upload, .zabbix-server-pgsql]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "Dockerfile Scan"
  needs:
    - job: zabbix-server-pgsql-test
      artifacts: true
  when: always


zabbix-server-pgsql-image-scan-reports:
  extends: [.defectdojo_upload, .zabbix-server-pgsql]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$IMAGE_PATH - Image Scan"
  needs:
    - job: zabbix-server-pgsql-build
      artifacts: true
  when: always