.sentry:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "sentry/**/*"
    DIR_PATH: "sentry"
    BASE_IMAGE: "sentry:9.1.2"
    # IMAGE_VERSION: "9.1.2-kbt-proxy"
    IMAGE_VERSION: "9.1.2-kl-proxy"
    IMAGE_PATH: "base/sentry:$IMAGE_VERSION"
    
sentry-test:
  extends: [.sentry, .test]

sentry-build:
  extends: [.sentry, .build]
  needs: ["sentry-test"]

sentry-config-scan-reports:
  extends: [.defectdojo_upload, .sentry]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Config Scan"
  needs:
    - job: sentry-test
      artifacts: true
  when: always


sentry-image-scan-reports:
  extends: [.defectdojo_upload, .sentry]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Image Scan"
  needs:
    - job: sentry-build
      artifacts: true
  when: always

