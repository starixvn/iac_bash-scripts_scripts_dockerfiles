.dotnetcore7:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "dotnetcore7/**/*"
    DIR_PATH: "dotnetcore7"
    IMAGE_VERSION: "7.0-alpine"
    IMAGE_TAG: "7.0-alpine"
    BASE_IMAGE: "mcr.microsoft.com/dotnet/aspnet:$IMAGE_TAG"
    # IMAGE_PATH: "rebuild-baseimage/dotnetcore/aspnet:$IMAGE_VERSION"
    IMAGE_PATH: "base/dotnet/core/aspnet:$IMAGE_VERSION"

dotnetcore7-test:
  extends: [.dotnetcore7, .test]

dotnetcore7-build:
  extends: [.dotnetcore7, .build]
  needs: ["dotnetcore7-test"]

