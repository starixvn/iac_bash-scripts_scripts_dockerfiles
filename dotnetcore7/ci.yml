.dotnetcore7:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "dotnetcore7/**/*"
    DIR_PATH: "dotnetcore7"
    IMAGE_VERSION: "7.0-alpine"
    IMAGE_TAG: "7.0-alpine"
    BASE_IMAGE: "mcr.microsoft.com/dotnet/aspnet:$IMAGE_TAG"
    # IMAGE_PATH: "rebuild-baseimage/dotnetcore/aspnet:$IMAGE_VERSION"
    IMAGE_PATH: "base/dotnet/core/aspnet:$IMAGE_VERSION"

dotnetcore7-test:
  extends: [.dotnetcore7, .test]

dotnetcore7-build:
  extends: [.dotnetcore7, .build]
  needs: ["dotnetcore7-test"]

dotnetcore7-config-scan-reports:
  extends: [.defectdojo_upload, .dotnetcore7]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Config Scan"
  needs:
    - job: dotnetcore7-test
      artifacts: true
  when: always


dotnetcore7-image-scan-reports:
  extends: [.defectdojo_upload, .dotnetcore7]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Image Scan"
  needs:
    - job: dotnetcore7-build
      artifacts: true
  when: always