.dotnetcore8-bookworm-slim-nap-mail:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "dotnetcore8-bookworm-slim-nap-mail/**/*"
    DIR_PATH: "dotnetcore8-bookworm-slim-nap-mail"
    IMAGE_VERSION: "8.0-nap-mail-core"
    # BASE_IMAGE: "mcr.microsoft.com/dotnet/aspnet:8.0-bookworm-slim"
    BASE_IMAGE: "hub.nexdev.net/base/dotbet/aspnet:8.0-bookworm-slim"
    # IMAGE_PATH: "rebuild-baseimage/dotnetcore/aspnet:$IMAGE_VERSION"
    IMAGE_PATH: "base/dotnet/core/aspnet:$IMAGE_VERSION"

dotnetcore8-bookworm-slim-nap-mail-test:
  extends: [.dotnetcore8-bookworm-slim-nap-mail, .test]

dotnetcore8-bookworm-slim-nap-mail-build:
  extends: [.dotnetcore8-bookworm-slim-nap-mail, .build]
  needs: ["dotnetcore8-bookworm-slim-nap-mail-test"]

dotnetcore8-bookworm-slim-nap-mail-config-scan-reports:
  extends: [.defectdojo_upload, .dotnetcore8-bookworm-slim-nap-mail]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Config Scan"
  needs:
    - job: dotnetcore8-bookworm-slim-nap-mail-test
      artifacts: true
  when: always


dotnetcore8-bookworm-slim-nap-mail-image-scan-reports:
  extends: [.defectdojo_upload, .dotnetcore8-bookworm-slim-nap-mail]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Image Scan"
  needs:
    - job: dotnetcore8-bookworm-slim-nap-mail-build
      artifacts: true
  when: always