.dotnetcore7-bulleyes:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "dotnetcore7-bulleyes/**/*"
    DIR_PATH: "dotnetcore7-bulleyes"
    IMAGE_VERSION: "7.0-nap-mail-core"
    BASE_IMAGE: "mcr.microsoft.com/dotnet/aspnet:7.0-bullseye-slim"
    # IMAGE_PATH: "rebuild-baseimage/dotnetcore/aspnet:$IMAGE_VERSION"
    IMAGE_PATH: "base/dotnet/core/aspnet:$IMAGE_VERSION"

dotnetcore7-bulleyes-test:
  extends: [.dotnetcore7-bulleyes, .test]

dotnetcore7-bulleyes-build:
  extends: [.dotnetcore7-bulleyes, .build]
  needs: ["dotnetcore7-bulleyes-test"]

dotnetcore7-bulleyes-config-scan-reports:
  extends: [.defectdojo_upload, .dotnetcore7-bulleyes]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "Dockerfile Scan"
  needs:
    - job: dotnetcore7-bulleyes-test
      artifacts: true
  when: always


dotnetcore7-bulleyes-image-scan-reports:
  extends: [.defectdojo_upload, .dotnetcore7-bulleyes]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$IMAGE_PATH - Image Scan"
  needs:
    - job: dotnetcore7-bulleyes-build
      artifacts: true
  when: always