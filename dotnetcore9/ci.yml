.dotnetcore9:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "dotnetcore9/**/*"
    DIR_PATH: "dotnetcore9"
    IMAGE_VERSION: "9.0-alpine-25h1"
    BASE_IMAGE: "mcr.microsoft.com/dotnet/aspnet:9.0-alpine"
    IMAGE_PATH: "base/dotnet/core/aspnet:$IMAGE_VERSION"

dotnetcore9-test:
  extends: [.dotnetcore9, .test]

dotnetcore9-build:
  extends: [.dotnetcore9, .build]
  needs: ["dotnetcore9-test"]

dotnetcore9-config-scan-reports:
  extends: [.defectdojo_upload, .dotnetcore9]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "Dockerfile Scan"
  needs:
    - job: dotnetcore9-test
      artifacts: true
  when: always


dotnetcore9-image-scan-reports:
  extends: [.defectdojo_upload, .dotnetcore9]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$IMAGE_PATH - Image Scan"
  needs:
    - job: dotnetcore9-build
      artifacts: true
  when: always