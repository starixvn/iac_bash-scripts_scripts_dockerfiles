.dotnetcore9-bookworm-slim-nap-mail:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "dotnetcore9-bookworm-slim-nap-mail/**/*"
    DIR_PATH: "dotnetcore9-bookworm-slim-nap-mail"
    BASE_IMAGE: "mcr.microsoft.com/dotnet/aspnet:9.0-bookworm-slim"
    IMAGE_VERSION: "9.0-nap-mail-core"
    # IMAGE_PATH: "rebuild-baseimage/dotnet/core/aspnet:$IMAGE_VERSION"
    IMAGE_PATH: "base/dotnet/core/aspnet:$IMAGE_VERSION"

dotnetcore9-bookworm-slim-nap-mail-test:
  extends: [.dotnetcore9-bookworm-slim-nap-mail, .test]

dotnetcore9-bookworm-slim-nap-mail-build:
  extends: [.dotnetcore9-bookworm-slim-nap-mail, .build]
  needs: ["dotnetcore9-bookworm-slim-nap-mail-test"]

dotnetcore9-bookworm-slim-nap-mail-config-scan-reports:
  extends: [.defectdojo_upload, .dotnetcore9-bookworm-slim-nap-mail]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Config Scan"
  needs:
    - job: dotnetcore9-bookworm-slim-nap-mail-test
      artifacts: true
  when: always


dotnetcore9-bookworm-slim-nap-mail-image-scan-reports:
  extends: [.defectdojo_upload, .dotnetcore9-bookworm-slim-nap-mail]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Image Scan"
  needs:
    - job: dotnetcore9-bookworm-slim-nap-mail-build
      artifacts: true
  when: always