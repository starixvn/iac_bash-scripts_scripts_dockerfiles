.dotnetcore9-slim:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "dotnetcore9-slim/**/*"
    DIR_PATH: "dotnetcore9-slim"
    BASE_IMAGE: "mcr.microsoft.com/dotnet/aspnet:9.0-bookworm-slim"
    IMAGE_VERSION: "9.0-slim"
    # IMAGE_PATH: "rebuild-baseimage/dotnet/core/aspnet:$IMAGE_VERSION"
    IMAGE_PATH: "base/dotnet/core/aspnet:$IMAGE_VERSION"

dotnetcore9-slim-test:
  extends: [.dotnetcore9-slim, .test]

dotnetcore9-slim-build:
  extends: [.dotnetcore9-slim, .build]
  needs: ["dotnetcore9-slim-test"]

dotnetcore9-slim-config-scan-reports:
  extends: [.defectdojo_upload, .dotnetcore9-slim]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "Dockerfile Scan"
  needs:
    - job: dotnetcore9-slim-test
      artifacts: true
  when: always


dotnetcore9-slim-image-scan-reports:
  extends: [.defectdojo_upload, .dotnetcore9-slim]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$IMAGE_PATH - Image Scan"
  needs:
    - job: dotnetcore9-slim-build
      artifacts: true
  when: always