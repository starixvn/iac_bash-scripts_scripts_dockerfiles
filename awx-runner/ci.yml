.awx-runner:
#  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "awx-runner/**/*"
    DIR_PATH: "awx-runner"
    BASE_IMAGE: "quay.io/ansible/awx-ee:24.1.0"
    IMAGE_VERSION: "24.1.0"
    IMAGE_PATH: "base/awx/awx-runner:$IMAGE_VERSION"
    
awx-runner-test:
  extends: [.awx-runner, .test]

trivy-reports:
  extends: [.defectdojo_upload, .alpine]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "trivy-report.json"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "GitLab-CI Trivy Scan"
  needs:
    - job: awx-runner-test
      artifacts: true



