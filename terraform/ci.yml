.terraform:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "terraform/**/*"
    DIR_PATH: "terraform"
    BASE_IMAGE: "hashicorp/terraform:$IMAGE_VERSION-vault"
    IMAGE_VERSION: "1.4.5"
#    IMAGE_PATH: "rebuild-baseimage/hashicorp/terraform:$IMAGE_VERSION"
    IMAGE_PATH: "base/hashicorp/terraform:$IMAGE_VERSION"
    
terraform-test:
  extends: [.terraform, .test]

terraform-build:
  extends: [.terraform, .build]
  needs: ["terraform-test"]
