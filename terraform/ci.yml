.terraform:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "terraform/**/*"
    DIR_PATH: "terraform"
    BASE_IMAGE: "hashicorp/terraform:$IMAGE_VERSION"
    IMAGE_VERSION: "1.11.4"
    IMAGE_PATH: "base/hashicorp/terraform:$IMAGE_VERSION-vault"
    
terraform-test:
  extends: [.terraform, .test]

terraform-build:
  extends: [.terraform, .build]
  needs: ["terraform-test"]
##
