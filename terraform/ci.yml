.terraform:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "terraform/**/*"
    DIR_PATH: "terraform"
    BASE_IMAGE: "hashicorp/terraform:$IMAGE_VERSION"
    IMAGE_VERSION: "1.11.4"
    IMAGE_PATH: "base/hashicorp/terraform:$IMAGE_VERSION-vault"
    
terraform-test:
  extends: [.terraform, .test]

terraform-build:
  extends: [.terraform, .build]
  needs: ["terraform-test"]
##
terraform-config-scan-reports:
  extends: [.defectdojo_upload, .terraform]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Config Scan"
  needs:
    - job: terraform-test
      artifacts: true
  when: always


terraform-image-scan-reports:
  extends: [.defectdojo_upload, .terraform]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Image Scan"
  needs:
    - job: terraform-build
      artifacts: true
  when: always