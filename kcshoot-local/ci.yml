.kcshoot-local:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "kcshoot-local/**/*"
    DIR_PATH: "kcshoot-local"
    IMAGE_VERSION: "local"
    BASE_IMAGE: "alpine:3.20.3"
    IMAGE_PATH: "base/kcshoot:$IMAGE_VERSION"

kcshoot-local-test:
  extends: [.kcshoot-local, .test]

kcshoot-local-build:
  extends: [.kcshoot-local, .build]
  needs: ["kcshoot-local-test"]

kcshoot-local-config-scan-reports:
  extends: [.defectdojo_upload, .kcshoot-local]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "Dockerfile Scan"
  needs:
    - job: kcshoot-local-test
      artifacts: true
  when: always


kcshoot-local-image-scan-reports:
  extends: [.defectdojo_upload, .kcshoot-local]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$IMAGE_PATH - Image Scan"
  needs:
    - job: kcshoot-local-build
      artifacts: true
  when: always