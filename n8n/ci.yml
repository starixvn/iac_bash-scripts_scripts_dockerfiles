.n8n:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "n8n/**/*"
    DIR_PATH: "n8n"
    IMAGE_VERSION: "1.88.0-uv"
    BASE_IMAGE: "n8nio/n8n:1.88.0"
    IMAGE_PATH: "base/n8nio/n8n:$IMAGE_VERSION"

n8n-test:
  extends: [.n8n, .test]

n8n-build:
  extends: [.n8n, .build]
  needs: ["n8n-test"]

