.n8n:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "n8n/**/*"
    DIR_PATH: "n8n"
    IMAGE_VERSION: "1.88.0-uv"
    BASE_IMAGE: "n8nio/n8n:1.88.0"
    IMAGE_PATH: "base/n8nio/n8n:$IMAGE_VERSION"

n8n-test:
  extends: [.n8n, .test]

n8n-build:
  extends: [.n8n, .build]
  needs: ["n8n-test"]

n8n-config-scan-reports:
  extends: [.defectdojo_upload, .n8n]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Config Scan"
  needs:
    - job: n8n-test
      artifacts: true
  when: always


n8n-image-scan-reports:
  extends: [.defectdojo_upload, .n8n]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Image Scan"
  needs:
    - job: n8n-build
      artifacts: true
  when: always