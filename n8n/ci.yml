.node-alpine:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "node/**/*"
    DIR_PATH: "node"
    IMAGE_VERSION: "18.20-alpine-25h1"
    BASE_IMAGE: "node:18.20-alpine"
    IMAGE_PATH: "base/node:$IMAGE_VERSION"

node-alpine-test:
  extends: [.node-alpine, .test]

node-alpine-build:
  extends: [.node-alpine, .build]
  needs: ["node-alpine-test"]

