.dotnetcore8:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "dotnetcore8/**/*"
    DIR_PATH: "dotnetcore8"
    IMAGE_VERSION: "8.0-alpine"
    IMAGE_TAG: "8.0-alpine"
    BASE_IMAGE: "mcr.microsoft.com/dotnet/aspnet:$IMAGE_TAG"
    # IMAGE_PATH: "rebuild-baseimage/dotnetcore/aspnet:$IMAGE_VERSION"
    IMAGE_PATH: "base/dotnet/core/aspnet:$IMAGE_VERSION"

dotnetcore8-test:
  extends: [.dotnetcore8, .test]

dotnetcore8-build:
  extends: [.dotnetcore8, .build]
  needs: ["dotnetcore8-test"]

dotnetcore8-config-scan-reports:
  extends: [.defectdojo_upload, .dotnetcore8]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "Dockerfile Scan"
  needs:
    - job: dotnetcore8-test
      artifacts: true
  when: always


dotnetcore8-image-scan-reports:
  extends: [.defectdojo_upload, .dotnetcore8]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$IMAGE_PATH - Image Scan"
  needs:
    - job: dotnetcore8-build
      artifacts: true
  when: always