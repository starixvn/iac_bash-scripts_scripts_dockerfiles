.postgres16:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "postgres16/**/*"
    DIR_PATH: "postgres16"
    BASE_IMAGE: "bitnami/postgresql:$IMAGE_VERSION"
    IMAGE_VERSION: "16.3.0-debian-12-r19"
    IMAGE_PATH: "base/postgres:$IMAGE_VERSION-pgvector"
    
postgres16-test:
  extends: [.postgres16, .test]

postgres16-build:
  extends: [.postgres16, .build]
  needs: ["postgres16-test"]

postgres16-config-scan-reports:
  extends: [.defectdojo_upload, .postgres16]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "Dockerfile Scan"
  needs:
    - job: postgres16-test
      artifacts: true
  when: always


postgres16-image-scan-reports:
  extends: [.defectdojo_upload, .postgres16]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$IMAGE_PATH - Image Scan"
  needs:
    - job: postgres16-build
      artifacts: true
  when: always