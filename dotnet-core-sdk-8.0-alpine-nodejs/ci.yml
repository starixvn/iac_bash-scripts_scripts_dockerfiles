.dotnetcoresdk80-alpine-nodejs:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "dotnet-core-sdk-8.0-alpine-nodejs/**/*"
    DIR_PATH: "dotnet-core-sdk-8.0-alpine-nodejs"
    BASE_IMAGE: "mcr.microsoft.com/dotnet/sdk:8.0-alpine3.20"
    IMAGE_VERSION: "8.0-alpine-nodejs"
    IMAGE_PATH: "base/dotnet/core/sdk:$IMAGE_VERSION"

dotnetcoresdk80-alpine-nodejs-test:
  extends: [.dotnetcoresdk80-alpine-nodejs, .test]

dotnetcoresdk80-alpine-nodejs-build:
  extends: [.dotnetcoresdk80-alpine-nodejs, .build]
  needs: ["dotnetcoresdk80-alpine-nodejs-test"]
