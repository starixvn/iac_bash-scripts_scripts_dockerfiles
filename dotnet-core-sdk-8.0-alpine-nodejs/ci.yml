.dotnetcoresdk80-alpine-nodejs:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "dotnet-core-sdk-8.0-alpine-nodejs/**/*"
    DIR_PATH: "dotnet-core-sdk-8.0-alpine-nodejs"
    BASE_IMAGE: "mcr.microsoft.com/dotnet/sdk:8.0-alpine3.20"
    IMAGE_VERSION: "8.0-nodejs-v20"
    IMAGE_PATH: "base/dotnet/core/sdk:$IMAGE_VERSION"

dotnetcoresdk80-alpine-nodejs-test:
  extends: [.dotnetcoresdk80-alpine-nodejs, .test]

dotnetcoresdk80-alpine-nodejs-build:
  extends: [.dotnetcoresdk80-alpine-nodejs, .build]
  needs: ["dotnetcoresdk80-alpine-nodejs-test"]

dotnetcoresdk80-alpine-nodejs-config-scan-reports:
  extends: [.defectdojo_upload, .dotnetcoresdk80-alpine-nodejs]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "Dockerfile Scan"
  needs:
    - job: dotnetcoresdk80-alpine-nodejs-test
      artifacts: true
  when: always


dotnetcoresdk80-alpine-nodejs-image-scan-reports:
  extends: [.defectdojo_upload, .dotnetcoresdk80-alpine-nodejs]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$IMAGE_PATH - Image Scan"
  needs:
    - job: dotnetcoresdk80-alpine-nodejs-build
      artifacts: true
  when: always