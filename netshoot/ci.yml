.netshoot:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "netshoot/**/*"
    DIR_PATH: "netshoot"
    BASE_IMAGE: "alpine:3.20.3"
    # BASE_IMAGE: "ubuntu:noble"
    IMAGE_VERSION: "latest"
    IMAGE_PATH: "base/nexops-tools/netshoot:$IMAGE_VERSION"

netshoot-test:
  extends: [.netshoot, .test]

netshoot-build:
  extends: [.netshoot, .build]
  needs: ["netshoot-test"]

netshoot-config-scan-reports:
  extends: [.defectdojo_upload, .netshoot]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "Dockerfile Scan"
  needs:
    - job: netshoot-test
      artifacts: true
  when: always


netshoot-image-scan-reports:
  extends: [.defectdojo_upload, .netshoot]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$IMAGE_PATH - Image Scan"
  needs:
    - job: netshoot-build
      artifacts: true
  when: always