.dotnetcore5-alpine:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "dotnetcore5-alpine/**/*"
    DIR_PATH: "dotnetcore5-alpine"
    IMAGE_VERSION: "5.0-alpine"
    IMAGE_TAG: "5.0.16-alpine3.14"
    BASE_IMAGE: "mcr.microsoft.com/dotnet/aspnet:$IMAGE_TAG"
    # IMAGE_PATH: "rebuild-baseimage/dotnetcore/aspnet:$IMAGE_VERSION"
    IMAGE_PATH: "base/dotnet/core/aspnet:$IMAGE_VERSION"


dotnetcore5-alpine-test:
  extends: [.dotnetcore5-alpine, .test]

dotnetcore5-alpine-build:
  extends: [.dotnetcore5-alpine, .build]
  needs: ["dotnetcore5-alpine-test"]


dotnetcore5-config-scan-reports:
  extends: [.defectdojo_upload, .dotnetcore5]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Config Scan "
  needs:
    - job: dotnetcore5-test
      artifacts: true
  when: always


dotnetcore5-image-scan-reports:
  extends: [.defectdojo_upload, .dotnetcore5]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Image Scan "
  needs:
    - job: dotnetcore5-build
      artifacts: true
  when: always