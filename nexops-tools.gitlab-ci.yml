######### HAPROXY
.haproxy:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "haproxy/**/*"
    DIR_PATH: "haproxy"
    BASE_IMAGE: "haproxytech/haproxy-ubuntu:$IMAGE_VERSION"
    IMAGE_VERSION: "2.7"
    IMAGE_PATH: "base/haproxy/haproxy-ubuntu:$IMAGE_VERSION"

#########
######### portainer
.portainer:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "portainer/**/*"
    DIR_PATH: "portainer"
    BASE_IMAGE: "portainer/portainer:$IMAGE_VERSION"
    IMAGE_VERSION: "2.18.1"
    IMAGE_PATH: "base/portainer:$IMAGE_VERSION"
#########