.file-beat:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "file-beat/**/*"
    DIR_PATH: "file-beat"
    IMAGE_VERSION: "7.17.6"
    IMAGE_TAG: "7.17.6"
    BASE_IMAGE: "docker.elastic.co/beats/filebeat:$IMAGE_TAG"
    IMAGE_PATH: "base/logging/filebeat:$IMAGE_VERSION"

file-beat-test:
  extends: [.file-beat, .test]

file-beat-build:
  extends: [.file-beat, .build]
  needs: ["file-beat-test"]

file-beat-config-scan-reports:
  extends: [.defectdojo_upload, .file-beat]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "Dockerfile Scan"
  needs:
    - job: file-beat-test
      artifacts: true
  when: always


file-beat-image-scan-reports:
  extends: [.defectdojo_upload, .file-beat]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$IMAGE_PATH - Image Scan"
  needs:
    - job: file-beat-build
      artifacts: true
  when: always