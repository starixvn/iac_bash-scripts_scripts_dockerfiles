.grafana:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "grafana/**/*"
    DIR_PATH: "grafana"
    ENV: "local"
    IMAGE_VERSION: "$ENV-10.0.1-ubuntu-d11"
    IMAGE_TAG: "10.1.4-debian-11-r7"
    BASE_IMAGE: "hub.nexdev.net/base/grafana:local-10.0.1-ubuntu" #"bitnami/grafana:$IMAGE_TAG"
    IMAGE_PATH: "base/grafana:$IMAGE_VERSION"
    
grafana-test:
  extends: [.grafana, .test]

grafana-build:
  extends: [.grafana, .build]
  needs: ["grafana-test"]
##
grafana-deploy:
  extends: [.grafana, .deploy]
  needs: ["grafana-build"]

grafana-config-scan-reports:
  extends: [.defectdojo_upload, .grafana]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Config Scan"
  needs:
    - job: grafana-test
      artifacts: true
  when: always


grafana-image-scan-reports:
  extends: [.defectdojo_upload, .grafana]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Image Scan"
  needs:
    - job: grafana-build
      artifacts: true
  when: always