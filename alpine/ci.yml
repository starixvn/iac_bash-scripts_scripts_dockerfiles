.alpine:
  # extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "alpine/**/*"
    DIR_PATH: "alpine"
    IMAGE_TAG: "git-3.21"
    BASE_IMAGE: "alpine:3.21"
    IMAGE_PATH: "base/alpine:$IMAGE_TAG"
    
alpine-test:
  extends: [.alpine, .test]
  variables:
    TRIVY_REPORT_FILE: "config-$DIR_PATH-trivy-report.json"
  artifacts:
    paths:
      - ${TRIVY_REPORT_FILE}
# alpine-build:
#  extends: [.alpine, .build]
#  needs: ["alpine-test"]

alpine-reports:
  extends: [.defectdojo_upload, .alpine]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    # DEFECTDOJO_SCAN_FILE: "${TRIVY_REPORT_FILE}"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$DIR_PATH (Trivy Scan)"
  needs:
    - job: alpine-test
      artifacts: true
    # - job: alpine-build
    #   artifacts: true
  when: always




