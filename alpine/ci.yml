.alpine:
  # extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "alpine/**/*"
    DIR_PATH: "alpine"
    IMAGE_TAG: "git-3.21"
    BASE_IMAGE: "alpine:3.21"
    IMAGE_PATH: "base/alpine:$IMAGE_TAG"
    # IMAGE_REPORT: "image-$DIR_PATH-trivy-report.json"
    
alpine-test:
  extends: [.alpine, .test]
  # variables:
  #   CONFIG_REPORT: "trivy-report.json"

# alpine-build:
#  extends: [.alpine, .build]
#  needs: ["alpine-test"]

alpine-reports:
  extends: [.defectdojo_upload, .alpine]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Config Scan"
  dependencies:
    - alpine-test
    # - job: alpine-build
    #   artifacts: true
  when: always




