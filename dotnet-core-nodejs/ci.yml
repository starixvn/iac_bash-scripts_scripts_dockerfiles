.dotnetcorenodejs:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "dotnet-core-nodejs/**/*"
    DIR_PATH: "dotnet-core-nodejs"
    IMAGE_VERSION: "8.0-node22-25h1"
    BASE_IMAGE: "mcr.microsoft.com/dotnet/aspnet:8.0-alpine"
    IMAGE_PATH: "base/dotnet/core/aspnet:$IMAGE_VERSION"
    # IMAGE_PATH: "base/node:$IMAGE_VERSION"

dotnetcorenodejs-test:
  extends: [.dotnetcorenodejs, .test]

dotnetcorenodejs-build:
  extends: [.dotnetcorenodejs, .build]
  needs: ["dotnetcorenodejs-test"]