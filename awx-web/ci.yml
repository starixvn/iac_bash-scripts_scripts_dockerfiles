.awx-web:
  # extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "awx-web/**/*"
    DIR_PATH: "awx-web"
    BASE_IMAGE: "hub.nexdev.net/base/awx/web:$IMAGE_VERSION"
    IMAGE_VERSION: "11.2.0"
    IMAGE_PATH: "rebuild-baseimage/awx-web:$IMAGE_VERSION"
    
awx-web-test:
  extends: [.awx-web, .test]


awx-web-reports:
  extends: [.defectdojo_upload, .awx-web]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "trivy-report.json"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "GitLab-CI Trivy Scan"
  needs:
    - job: awx-web-test
      artifacts: true

