.portainer:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "portainer/**/*"
    DIR_PATH: "portainer"
    BASE_IMAGE: "portainer/portainer-ce:$IMAGE_VERSION"
    IMAGE_VERSION: "2.18.1"
    IMAGE_PATH: "rebuild-baseimage/portainer-ce:$IMAGE_VERSION"

portainer-test:
  extends: [.portainer, .test]

portainer-build:
  extends: [.portainer, .build]
  needs: ["portainer-test"]


portainer-config-scan-reports:
  extends: [.defectdojo_upload, .portainer]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "Dockerfile Scan"
  needs:
    - job: portainer-test
      artifacts: true
  when: always


portainer-image-scan-reports:
  extends: [.defectdojo_upload, .portainer]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$IMAGE_PATH - Image Scan"
  needs:
    - job: portainer-build
      artifacts: true
  when: always


