.portainer:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "portainer/**/*"
    DIR_PATH: "portainer"
    BASE_IMAGE: "portainer/portainer-ce:$IMAGE_VERSION"
    IMAGE_VERSION: "2.18.1"
    IMAGE_PATH: "base/portainer/portainer-ce:$IMAGE_VERSION"

portainer-test:
  extends: [.portainer, .test]

portainer-build:
  extends: [.portainer, .build]
  needs: ["portainer-test"]

portainer-deploy:
  extends: [.portainer, .deploy]
  needs: ["portainer-build"]