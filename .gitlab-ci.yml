stages:
  - test
############
include:
  - local: "base.yml"
  - local: "/alpine/ci.yml"
#  - local: "/awx-runner/ci.yml"
#  - local: "/awx-web/ci.yml"

.test:
  stage: test
  variables:
    TRIVY_REPORT_FILE: "trivy-report.json"
  script:
    # Download and extract Trivy scanner
    - wget --no-verbose https://gitlab.nexdev.net/NEXOPS/tools/trivy-scan/-/raw/main/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz?inline=false -O - | tar -zxvf -
    # Display Dockerfile contents  
    - cat $DIR_PATH/Dockerfile
    # Log Trivy version and server info
    - echo "$TRIVY_SERVER - $TRIVY_VERSION"
    # Run Trivy security scan with error handling
    - |
      # Check for HIGH severity issues with proper error handling
      ./trivy config --exit-code 0 --severity HIGH $DIR_PATH/ --format json --output ${TRIVY_REPORT_FILE}
      # Check for CRITICAL severity issues with proper error handling
      ./trivy config --exit-code 1 --severity CRITICAL $DIR_PATH/ --format json --output ${TRIVY_REPORT_FILE}
    - echo "done Scan Dockerfile !"
  tags:
    - docker
  artifacts:
    when: always
    paths:
      - ${TRIVY_REPORT_FILE}

.defectdojo_upload:
  image: $DOCKER_REG_LOCAL_URL/base/alpine:git-3.21
  stage: test
  needs: []
  script:
    - |
      set -euo pipefail

      # Combined setup and validation
      validate_vars() {
        for var in DEFECTDOJO_URL DEFECTDOJO_API_KEY CI_PROJECT_NAME DEFECTDOJO_DEPT ENGAGEMENT_NAME; do
          [ -z "${!var}" ] && echo "❌ $var not set" >&2 && exit 1
        done
        [ -f "${DEFECTDOJO_SCAN_FILE}" ] || { echo "❌ Scan file missing"; exit 1; }
      }

      api_request() {
        local method=${1:-GET}
        local url="$2"
        local data="${3:-}"
        local response
        response=$(curl -s -w "\n%{http_code}" -X "$method" \
          -H "Authorization: Token ${DEFECTDOJO_API_KEY}" \
          ${data:+-H "Content-Type: application/json" -d "$data"} \
          "$url")
        echo "${response%$'\n'*}" && return ${response##*$'\n'}
      }

      ensure_resource() {
        local type=$1 name=$2 query=$3 create_data=$4
        echo "🔍 Checking $type: $name"
        local response status body id

        response=$(api_request "GET" "${DEFECTDOJO_URL}/api/v2/${type}/?${query}")
        status=$?
        body="${response%$'\n'*}"

        if [ "$status" -eq 200 ] && [ "$(jq -r '.count' <<< "$body")" -gt 0 ]; then
          id=$(jq -r '.results[0].id' <<< "$body")
          echo "✅ Found $type ID: $id"
          eval "${type^^}_ID=$id"
        else
          echo "📝 Creating $type..."
          response=$(api_request "POST" "${DEFECTDOJO_URL}/api/v2/${type}/" "$create_data")
          if [ $? -eq 201 ]; then
            id=$(jq -r '.id' <<< "${response%$'\n'*}")
            eval "${type^^}_ID=$id"
            echo "✅ Created $type ID: $id"
          else
            echo "❌ Create failed"
            jq <<< "$body"
            exit 1
          fi
        fi
      }

      # Main execution flow
      validate_vars

      ensure_resource product_types "product type" "name=${DEFECTDOJO_DEPT}" \
        "$(jq -n --arg n "$DEFECTDOJO_DEPT" '{name: $n, description: "Auto-created for \($n)"}')"

      ensure_resource products "product" "name=${CI_PROJECT_NAME}" \
        "$(jq -n --arg n "$CI_PROJECT_NAME" --arg pt "$PRODUCT_TYPE_ID" \
        '{name: $n, description: "Auto-created product", prod_type: $pt}')"

      engagement_data=$(jq -n \
        --arg n "$ENGAGEMENT_NAME" \
        --arg p "$PRODUCT_ID" \
        --arg ts "$(date +%F)" \
        --arg te "$(date -d "+${DEFECTDOJO_ENGAGEMENT_PERIOD:-30} days" +%F)" \
        --argjson d "${DEFECTDOJO_ENGAGEMENT_DEDUPLICATION_ON_ENGAGEMENT:-true}" \
        '{name: $n, product: $p, target_start: $ts, target_end: $te, status: "In Progress",
          deduplication_on_engagement: $d, threat_model: false, api_test: false, pen_test: false, check_list: false}')
      ensure_resource engagements "engagement" "product=${PRODUCT_ID}&name=${ENGAGEMENT_NAME}" "$engagement_data"
    - echo "📤 Uploading Trivy scan report to DefectDojo"
    - |
      curl -s -S -X POST "${DEFECTDOJO_URL}/api/v2/reimport-scan/" \
        -H "Authorization: Token ${DEFECTDOJO_API_KEY}" \
        -F "scan_date=$(date +%F)" \
        -F "minimum_severity=Medium" \
        -F "scan_type=${DEFECTDOJO_SCAN_TYPE}" \
        -F "active=true" \
        -F "verified=true" \
        -F "product_name=${CI_PROJECT_NAME}" \
        -F "engagement=${ENGAGEMENT_ID}" \
        -F "test_type=${DEFECTDOJO_SCAN_TEST_TYPE}" \
        -F "auto_create_context=true" \
        -F "deduplication_on_engagement=true" \
        -F "close_old_findings=true" \
        -F "file=@${DEFECTDOJO_SCAN_FILE}" \
        -w "\nHTTP Status: %{http_code}\n" \
        || ECHO_CURL_ERROR=$?
    - |
      if [ -n "${ECHO_CURL_ERROR:-}" ]; then
        echo "❌ Failed to upload report (curl error code: $ECHO_CURL_ERROR)"
        exit 1
      fi
    - echo "✅ Upload completed"
  tags:
    - docker