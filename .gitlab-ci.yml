stages:
  - test
############
include:
  - local: "base.yml"
  - local: "/alpine/ci.yml"
  - local: "/awx-runner/ci.yml"
  - local: "/awx-web/ci.yml"

.test:
  stage: test
  variables:
    TRIVY_REPORT_FILE: "trivy-report.json"
  script:
    # Download and extract Trivy scanner
    - wget --no-verbose https://gitlab.nexdev.net/NEXOPS/tools/trivy-scan/-/raw/main/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz?inline=false -O - | tar -zxvf -
    # Display Dockerfile contents  
    - cat $DIR_PATH/Dockerfile
    # Log Trivy version and server info
    - echo "$TRIVY_SERVER - $TRIVY_VERSION"
    # Run Trivy security scan with error handling
    - |
      # Run single scan for both HIGH and CRITICAL severities
      ./trivy config --exit-code 1 --severity HIGH,CRITICAL $DIR_PATH/ --format json --output ${TRIVY_REPORT_FILE}
    - echo "done Scan Dockerfile !"
  tags:
    - docker
  artifacts:
    when: always
    paths:
      - ${TRIVY_REPORT_FILE}

.defectdojo_upload:
  image: $DOCKER_REG_LOCAL_URL/base/alpine:git-3.21
  stage: test
  needs: []
  script:
    - echo "🔍 Checking DefectDojo availability"
    - |
      # Validate required variables
      for var in DEFECTDOJO_URL DEFECTDOJO_API_KEY CI_PROJECT_NAME DEFECTDOJO_DEPT; do
        if [ -z "$(eval echo \$$var)" ]; then
          echo "❌ Error: $var not set"
          exit 1
        fi
      done

      # Helper functions
      handle_error() { echo "❌ $1"; exit 1; }
      api_call() { 
        local response
        response=$(curl -s -S -w "\n%{http_code}" -H "Authorization: Token ${DEFECTDOJO_API_KEY}" "$@")
        echo "$response"
      }
      get_id() { echo "$1" | jq -r '.results[0].id'; }
      process_response() {
        local response=$1
        local expected_status=$2
        local error_msg=$3
        local status=$(echo "$response" | tail -n1)
        local body=$(echo "$response" | sed '$d')
        [ "$status" -eq "$expected_status" ] || handle_error "$error_msg (HTTP $status)"
        echo "$body"
      }

      # Get/Create product type
      response=$(api_call "${DEFECTDOJO_URL}/api/v2/product_types/?name=${DEFECTDOJO_DEPT}") || handle_error "Failed to query product type"
      body=$(process_response "$response" 200 "Failed to query product type")
      
      if [ "$(echo "$body" | jq '.count')" -ge 1 ]; then
        PRODUCT_TYPE_ID=$(get_id "$body")
        echo "✅ Product type '${DEFECTDOJO_DEPT}' found (ID: ${PRODUCT_TYPE_ID})"
      else
        echo "📝 Creating product type '${DEFECTDOJO_DEPT}'..."
        payload=$(jq -n --arg name "${DEFECTDOJO_DEPT}" --arg desc "Auto-created for ${DEFECTDOJO_DEPT}" '{name: $name, description: $desc}')
        response=$(api_call -X POST -H "Content-Type: application/json" "${DEFECTDOJO_URL}/api/v2/product_types/" -d "$payload")
        body=$(process_response "$response" 201 "Failed to create product type")
        PRODUCT_TYPE_ID=$(echo "$body" | jq -r '.id')
        echo "✅ Product type created (ID: ${PRODUCT_TYPE_ID})"
      fi

      # Get/Create product
      response=$(api_call "${DEFECTDOJO_URL}/api/v2/products/?name=${CI_PROJECT_NAME}")
      body=$(process_response "$response" 200 "Failed to query product")
      
      if [ "$(echo "$body" | jq '.count')" -ge 1 ]; then
        PRODUCT_ID=$(get_id "$body")
        echo "✅ Product '${CI_PROJECT_NAME}' found (ID: ${PRODUCT_ID})"
      else
        echo "📝 Creating product '${CI_PROJECT_NAME}'..."
        payload=$(jq -n --arg name "${CI_PROJECT_NAME}" --arg desc "Auto-created for ${CI_PROJECT_NAME}" --argjson type "${PRODUCT_TYPE_ID}" '{name: $name, description: $desc, prod_type: $type}')
        response=$(api_call -X POST -H "Content-Type: application/json" "${DEFECTDOJO_URL}/api/v2/products/" -d "$payload")
        body=$(process_response "$response" 201 "Failed to create product")
        PRODUCT_ID=$(echo "$body" | jq -r '.id')
        echo "✅ Product created (ID: ${PRODUCT_ID})"
      fi

      # Get/Create engagement
      response=$(api_call "${DEFECTDOJO_URL}/api/v2/engagements/?product=${PRODUCT_ID}&name=${ENGAGEMENT_NAME}")
      body=$(process_response "$response" 200 "Failed to query engagement")
      
      if [ "$(echo "$body" | jq '.count')" -ge 1 ]; then
        ENGAGEMENT_ID=$(get_id "$body")
        echo "✅ Engagement '${ENGAGEMENT_NAME}' found (ID: ${ENGAGEMENT_ID})"
      else
        echo "📝 Creating engagement '${ENGAGEMENT_NAME}'..."
        payload=$(jq -n \
          --arg name "$ENGAGEMENT_NAME" \
          --argjson product "$PRODUCT_ID" \
          --arg start "$(date +%F)" \
          --arg end "$(date -d "+${DEFECTDOJO_ENGAGEMENT_PERIOD} days" +%F)" \
          --arg status "${DEFECTDOJO_ENGAGEMENT_STATUS}" \
          '{name: $name, product: $product, target_start: $start, target_end: $end, status: $status, 
            deduplication_on_engagement: true, threat_model: false, api_test: false, 
            pen_test: false, check_list: false}')
        
        response=$(api_call -X POST -H "Content-Type: application/json" "${DEFECTDOJO_URL}/api/v2/engagements/" -d "$payload")
        body=$(process_response "$response" 201 "Failed to create engagement")
        ENGAGEMENT_ID=$(echo "$body" | jq -r '.id')
        echo "✅ Engagement created (ID: ${ENGAGEMENT_ID})"
      fi

    - test -f ${DEFECTDOJO_SCAN_FILE} || { echo "❌ Trivy report not found"; exit 1; }
    - echo "📤 Uploading Trivy scan report to DefectDojo"
    - |
      curl -s -S -X POST "${DEFECTDOJO_URL}/api/v2/reimport-scan/" \
        -H "Authorization: Token ${DEFECTDOJO_API_KEY}" \
        -F "scan_date=$(date +%F)" \
        -F "minimum_severity=${DEFECTDOJO_SCAN_MINIMUM_SEVERITY}" \
        -F "scan_type=${DEFECTDOJO_SCAN_TYPE}" \
        -F "active=true" \
        -F "verified=true" \
        -F "product_name=${CI_PROJECT_NAME}" \
        -F "engagement_name=${ENGAGEMENT_NAME}" \
        -F "engagement=${ENGAGEMENT_ID}" \
        -F "test_type=\"${DEFECTDOJO_SCAN_TEST_TYPE}\"" \
        -F "auto_create_context=true" \
        -F "deduplication_on_engagement=true" \
        -F "close_old_findings=true" \
        -F "file=@${DEFECTDOJO_SCAN_FILE}" \
        -w "\nHTTP Status: %{http_code}\n" \
        || ECHO_CURL_ERROR=$?
    - |
      if [ -n "$ECHO_CURL_ERROR" ]; then
        echo "❌ Failed to upload report (curl error code: $ECHO_CURL_ERROR)"
        exit 1
      fi
    - echo "✅ Upload completed"
  tags:
    - docker