image: $DOCKER_REG_LOCAL_URL/base/docker:20.10.7-bash-jq
stages:
  - test
  - build
  - deploy
############
include: 'deploy-vars.gitlab-ci.yml'
#include: 'service-tools.gitlab-ci.yml'
###########
variables:
  RULES_CHANGES_PATH: "**/*"
.base-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes: 
        - $RULES_CHANGES_PATH
.test: &test
  stage: test
  script:
    - echo "test - $CI_ENVIRONMENT_NAME"
    - docker login -u $docker_reg_user -p $docker_reg_pass $docker_reg_url
    - echo "$DIR_PATH - Testing is DONE!";
  tags:
    - docker

.build: &build
  stage: build
  script:
    - echo "build - $DIR_PATH"
    - echo "docker build --no-cache --build-arg BASE_IMAGE="$BASE_IMAGE" -f $DIR_PATH/Dockerfile -t hub.nexdev.net/$IMAGE_PATH ."
    - docker build --no-cache --build-arg BASE_IMAGE="$BASE_IMAGE" -f $DIR_PATH/Dockerfile -t hub.nexdev.net/$IMAGE_PATH .
    - echo "$DIR_PATH - Build is DONE!";
  tags:
    - docker

.deploy: &deploy
  stage: deploy
  script:
    - echo "Push - hub.nexdev.net/$IMAGE_PATH"
    - docker push hub.nexdev.net/$IMAGE_PATH
    - echo "hub.nexdev.net/$IMAGE_PATH - deploy is DONE!";
  tags:
    - docker

.haproxy:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "haproxy/**/*"
    DIR_PATH: "haproxy"
    BASE_IMAGE: "haproxytech/haproxy-ubuntu:$IMAGE_VERSION"
    IMAGE_VERSION: "2.7"
    IMAGE_PATH: "base/haproxy/haproxy-ubuntu:$IMAGE_VERSION"

haproxy-test:
  extends: .haproxy
  <<: *test

haproxy-build:
  extends: .haproxy
  needs: ["haproxy-test"]
  <<: *build

haproxy-deploy:
  extends: .haproxy
  needs: ["haproxy-build"]
  <<: *deploy
