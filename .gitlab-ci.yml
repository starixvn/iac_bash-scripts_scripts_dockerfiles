stages:
  - test
############
include:
  - local: "base.yml"
  - local: "/alpine/ci.yml"
#  - local: "/awx-runner/ci.yml"
#  - local: "/awx-web/ci.yml"

.test:
  stage: test
  variables:
    TRIVY_REPORT_FILE: "trivy-report.json"
  script:
    # Download and extract Trivy scanner
    - wget --no-verbose https://gitlab.nexdev.net/NEXOPS/tools/trivy-scan/-/raw/main/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz?inline=false -O - | tar -zxvf -
    # Display Dockerfile contents  
    - cat $DIR_PATH/Dockerfile
    # Log Trivy version and server info
    - echo "$TRIVY_SERVER - $TRIVY_VERSION"
    # Run Trivy security scan with error handling
    - |
      # Check for HIGH severity issues with proper error handling
      ./trivy config --exit-code 0 --severity HIGH $DIR_PATH/ --format json --output ${TRIVY_REPORT_FILE}
      # Check for CRITICAL severity issues with proper error handling
      ./trivy config --exit-code 1 --severity CRITICAL $DIR_PATH/ --format json --output ${TRIVY_REPORT_FILE}
    - echo "done Scan Dockerfile !"
  tags:
    - docker
  artifacts:
    when: always
    paths:
      - ${TRIVY_REPORT_FILE}

defectdojo_create_engagement:
  stage: test
  image: $DOCKER_REG_LOCAL_URL/base/alpine:git-3.21
  variables:
    GIT_STRATEGY: none
  allow_failure: true
  before_script:
    - apk add curl jq coreutils
    - export TODAY=$(date +%Y-%m-%d)
    - export TARGET_END=$(date -d "+$DEFECTDOJO_ENGAGEMENT_PERIOD days" +%Y-%m-%d)
  script:
    - |
      export DEFECTDOJO_PRODUCT_ID=$(curl $DEFECTDOJO_URL/api/v2/products/ \
        -H "Authorization: Token $DEFECTDOJO_API_KEY" \
        -G --data-urlencode "name_exact=$[[ inputs.DEFECTDOJO_PRODUCT_NAME ]]" | jq -r .results[].id)
    - >
      export DEFECTDOJO_ENGAGEMENT_ID=$(curl $DEFECTDOJO_URL/api/v2/engagements/ \
        -H "Authorization: Token $DEFECTDOJO_API_KEY" \
        -G --data-urlencode "name=Pipeline #$CI_PIPELINE_ID" \
        --data-urlencode "product=$DEFECTDOJO_PRODUCT_ID" | jq -r .results[].id)
    - >
      if [ -z "$DEFECTDOJO_ENGAGEMENT_ID" ]; then
        export DEFECTDOJO_ENGAGEMENT_ID=$(curl -X POST $DEFECTDOJO_URL/api/v2/engagements/ \
          -H "accept: application/json" \
          -H "Content-Type: multipart/form-data" \
          -H "Authorization: Token $DEFECTDOJO_API_KEY" \
          -F "tags=GITLAB-CI" \
          -F "name=Pipeline #$CI_PIPELINE_ID" \
          -F "description=$CI_COMMIT_DESCRIPTION" \
          -F "version=$CI_COMMIT_REF_NAME" \
          -F "first_contacted=$TODAY" \
          -F "target_start=$TODAY" \
          -F "target_end=$TARGET_END" \
          -F "reason=string" \
          -F "tracker=$CI_PROJECT_URL" \
          -F "threat_model=$DEFECTDOJO_ENGAGEMENT_THREAT_MODEL" \
          -F "api_test=$DEFECTDOJO_ENGAGEMENT_THREAT_MODEL" \
          -F "pen_test=$DEFECTDOJO_ENGAGEMENT_PEN_TEST" \
          -F "check_list=$DEFECTDOJO_ENGAGEMENT_CHECK_LIST" \
          -F "status=$DEFECTDOJO_ENGAGEMENT_STATUS" \
          -F "engagement_type=CI/CD" \
          -F "build_id=$CI_PIPELINE_ID" \
          -F "commit_hash=$CI_COMMIT_SHORT_SHA" \
          -F "branch_tag=$CI_COMMIT_REF_NAME" \
          -F "deduplication_on_engagement=$DEFECTDOJO_ENGAGEMENT_DEDUPLICATION_ON_ENGAGEMENT" \
          -F "product=$DEFECTDOJO_PRODUCT_ID" \
          -F "source_code_management_uri=$CI_PROJECT_URL" | jq -r .id)
      fi
    - echo "DEFECTDOJO_ENGAGEMENTID=${ENGAGEMENTID}" >> defectdojo.env
  artifacts:
    reports:
      dotenv: defectdojo.env
  tags:
    - docker

defectdojo_publish:
  stage: test
  image: $DOCKER_REG_LOCAL_URL/base/alpine:git-3.21
  rules:
    - when: never
  before_script:
    - apk add curl coreutils
    - TODAY=`date +%Y-%m-%d`
  script:
    - echo "$CI_JOB_NAME is used for configuration only, and its script should not be executed"
    - exit 1
  tags:
    - docker

.defectdojo_upload:
  extends: defectdojo_publish
  allow_failure: true
  script:
    - |
      # Upload scan results to DefectDojo
      curl --fail --location --request POST "${DEFECTDOJO_URL}/api/v2/import-scan/" \
        --header "Authorization: Token ${DEFECTDOJO_API_KEY}" \
        --form "scan_date=\"${TODAY}\"" \
        --form "minimum_severity=\"${DEFECTDOJO_SCAN_MINIMUM_SEVERITY}\"" \
        --form "active=\"${DEFECTDOJO_SCAN_ACTIVE}\"" \
        --form "verified=\"${DEFECTDOJO_SCAN_VERIFIED}\"" \
        --form "scan_type=\"${DEFECTDOJO_SCAN_TYPE}\"" \
        --form "engagement=\"${DEFECTDOJO_ENGAGEMENTID}\"" \
        --form "file=@${DEFECTDOJO_SCAN_FILE}" \
        --form "close_old_findings=\"${DEFECTDOJO_SCAN_CLOSE_OLD_FINDINGS}\"" \
        --form "push_to_jira=\"${DEFECTDOJO_SCAN_PUSH_TO_JIRA}\"" \
        --form "test_type=\"${DEFECTDOJO_SCAN_TEST_TYPE}\"" \
        --form "environment=\"${DEFECTDOJO_SCAN_ENVIRONMENT}\""
  tags:
    - docker