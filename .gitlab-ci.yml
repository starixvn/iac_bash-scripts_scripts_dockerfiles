stages:
  - test
  - build
  - deploy
############
include: 'deploy-vars.gitlab-ci.yml'
#include: 'before-script.gitlab-ci.yml'
include: 'nexops-tools.gitlab-ci.yml'
before_script:
  - docker login -u $docker_reg_user -p $docker_reg_pass $docker_reg_url
  - echo "$TRIVY_SERVER - $TRIVY_VERSION";
###########
variables:
  RULES_CHANGES_PATH: "**/*"
.base-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes: 
        - $RULES_CHANGES_PATH
.test: &test
  stage: test
  script:
    - wget https://gitlab.nexdev.net/NEXOPS/tools/trivy-scan/-/raw/main/trivyignore?inline=false
    - wget --no-verbose https://gitlab.nexdev.net/NEXOPS/tools/trivy-scan/-/raw/main/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz?inline=false -O - | tar -zxvf -
    - ./trivy -d client --remote $TRIVY_SERVER --ignore-unfixed --exit-code 0 --severity HIGH --token $TRIVY_TOKEN $BASE_IMAGE
    - ./trivy -d client --remote $TRIVY_SERVER --ignore-unfixed --exit-code 1 --severity CRITICAL --token $TRIVY_TOKEN $BASE_IMAGE
    - echo "$DIR_PATH - Testing is DONE!";
  tags:
    - docker

.build: &build
  stage: build
  script:
    - echo "build - $DIR_PATH"
    - echo "docker build --no-cache --build-arg BASE_IMAGE="$BASE_IMAGE" -f $DIR_PATH/Dockerfile -t hub.nexdev.net/$IMAGE_PATH ."
    - docker build --no-cache --build-arg BASE_IMAGE="$BASE_IMAGE" -f $DIR_PATH/Dockerfile -t hub.nexdev.net/$IMAGE_PATH .
    - echo "$DIR_PATH - Build is DONE!";
  tags:
    - docker

.deploy: &deploy
  stage: deploy
  script:
    - echo "Push - hub.nexdev.net/$IMAGE_PATH"
    - docker push hub.nexdev.net/$IMAGE_PATH
    - echo "hub.nexdev.net/$IMAGE_PATH - deploy is DONE!";
  tags:
    - docker
###########
haproxy-test:
  extends: .haproxy
  <<: *test

haproxy-build:
  extends: .haproxy
  needs: ["haproxy-test"]
  <<: *build

haproxy-deploy:
  extends: .haproxy
  needs: ["haproxy-build"]
  <<: *deploy
###########
portainer-test:
  extends: .portainer
  <<: *test

portainer-build:
  extends: .portainer
  needs: ["portainer-test"]
  <<: *build

portainer-deploy:
  extends: .portainer
  needs: ["portainer-build"]
  <<: *deploy
