stages:
  - test
############
include:
  - local: "base.yml"
  - local: "/alpine/ci.yml"
#  - local: "/awx-runner/ci.yml"
#  - local: "/awx-web/ci.yml"

.test:
  stage: test
  variables:
    TRIVY_REPORT_FILE: "trivy-report.json"
  script:
    # Download and extract Trivy scanner
    - wget --no-verbose https://gitlab.nexdev.net/NEXOPS/tools/trivy-scan/-/raw/main/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz?inline=false -O - | tar -zxvf -
    # Display Dockerfile contents  
    - cat $DIR_PATH/Dockerfile
    # Log Trivy version and server info
    - echo "$TRIVY_SERVER - $TRIVY_VERSION"
    # Run Trivy security scan with error handling
    - |
      # Check for HIGH severity issues with proper error handling
      ./trivy config --exit-code 0 --severity HIGH $DIR_PATH/ --format json --output ${TRIVY_REPORT_FILE}
      # Check for CRITICAL severity issues with proper error handling
      ./trivy config --exit-code 1 --severity CRITICAL $DIR_PATH/ --format json --output ${TRIVY_REPORT_FILE}
    - echo "done Scan Dockerfile !"
  tags:
    - docker
  artifacts:
    when: always
    paths:
      - ${TRIVY_REPORT_FILE}

.defectdojo_upload:
  image: $DOCKER_REG_LOCAL_URL/base/alpine:git-3.21
  stage: test
  tags:
    - docker
  script:
    - |
      set -eo pipefail

      # Validate environment variables
      validate_env() {
        for var in DEFECTDOJO_URL DEFECTDOJO_API_KEY CI_PROJECT_NAME \
                   DEFECTDOJO_DEPT ENGAGEMENT_NAME DEFECTDOJO_SCAN_FILE \
                   DEFECTDOJO_SCAN_TYPE DEFECTDOJO_SCAN_TEST_TYPE; do
          eval value=\$$var
          [ -n "${value}" ] || { echo "❌ $var not set"; exit 1; }
        done
        [ -f "$DEFECTDOJO_SCAN_FILE" ] || { echo "❌ Scan file missing"; exit 1; }
      }

      # Universal API handler
      api_call() {
        method=$1
        endpoint=$2
        data=$3
        response=$(curl -sS -w "\n%{http_code}" -X "$method" \
          -H "Authorization: Token $DEFECTDOJO_API_KEY" \
          ${data:+-H "Content-Type: application/json" -d "$data"} \
          "$DEFECTDOJO_URL/api/v2/$endpoint")
        status_code=$(echo "$response" | tail -n1)
        body=$(echo "$response" | sed \$d)

        if [ "$status_code" -ge 400 ]; then
          echo "❌ API $endpoint failed (HTTP $status_code)"
          echo "$body" | jq . 1>&2
          exit 1
        fi
        echo "$body"
      }

      # Resource management
      manage_resource() {
        type=$1
        query=$2
        create_data=$3
        
        # URL encode query
        encoded_query=$(echo "$query" | curl -sSG -o /dev/null -w %{url_effective} --data-urlencode @- "" | cut -d? -f2)
        
        echo "🔍 Checking $type..."
        result=$(api_call GET "${type}/?${encoded_query}")
        count=$(echo "$result" | jq '.count')
        
        if [ "$count" -gt 0 ]; then
          id=$(echo "$result" | jq -r '.results[0].id')
          echo "✅ Existing ${type} ID: $id"
        else
          echo "📝 Creating new ${type}..."
          result=$(api_call POST "${type}/" "$create_data")
          id=$(echo "$result" | jq -r '.id')
          echo "✅ Created ${type} ID: $id"
        fi
        
        # Export variable (ash compatible)
        eval "export RESOURCE_ID=$id"
      }

      # Main process
      validate_env

      # Product Type
      manage_resource "product_types" "name=$DEFECTDOJO_DEPT" \
        "$(jq -n --arg name "$DEFECTDOJO_DEPT" '{name: $name, description: "Auto-created"}')"

      # Product
      manage_resource "products" "name=$CI_PROJECT_NAME" \
        "$(jq -n --arg name "$CI_PROJECT_NAME" --arg pt "$RESOURCE_ID" \
        '{name: $name, prod_type: $pt, description: "CI Generated"}')"

      # Engagement
      engagement_json() {
        jq -n --arg name "$ENGAGEMENT_NAME" \
          --arg product "$RESOURCE_ID" \
          --arg start "$(date +%Y-%m-%d)" \
          --arg end "$(date -d "+${DEFECTDOJO_ENGAGEMENT_PERIOD:-30} days" +%Y-%m-%d)" \
          --argjson dedup "${DEFECTDOJO_ENGAGEMENT_DEDUPLICATION_ON_ENGAGEMENT:-true}" \
          '{name: $name, product: $product, target_start: $start, target_end: $end,
            status: "In Progress", deduplication_on_engagement: $dedup,
            threat_model: false, api_test: false, pen_test: false, check_list: false}'
      }
      manage_resource "engagements" "product=$RESOURCE_ID&name=$ENGAGEMENT_NAME" "$(engagement_json)"

      # Upload scan
      echo "📤 Uploading scan report..."
      upload_response=$(curl -sS -X POST "$DEFECTDOJO_URL/api/v2/reimport-scan/" \
        -H "Authorization: Token $DEFECTDOJO_API_KEY" \
        -F "file=@$DEFECTDOJO_SCAN_FILE" \
        -F "engagement=$RESOURCE_ID" \
        -F "scan_type=$DEFECTDOJO_SCAN_TYPE" \
        -F "test_type=$DEFECTDOJO_SCAN_TEST_TYPE" \
        -F "close_old_findings=true")

      if echo "$upload_response" | jq -e '.success' >/dev/null; then
        echo "✅ Upload successful"
        echo "$upload_response" | jq -r '.message'
      else
        echo "❌ Upload failed: $(echo "$upload_response" | jq -r '.message')"
        exit 1
      fi