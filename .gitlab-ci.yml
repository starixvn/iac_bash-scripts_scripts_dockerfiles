stages:
  - test
############
include:
  - local: "base.yml"
  - local: "/alpine/ci.yml"
#  - local: "/awx-runner/ci.yml"
#  - local: "/awx-web/ci.yml"

.test:
  stage: test
  variables:
    TRIVY_REPORT_FILE: "trivy-report.json"
  script:
    # Download and extract Trivy scanner
    - wget --no-verbose https://gitlab.nexdev.net/NEXOPS/tools/trivy-scan/-/raw/main/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz?inline=false -O - | tar -zxvf -
    # Display Dockerfile contents  
    - cat $DIR_PATH/Dockerfile
    # Log Trivy version and server info
    - echo "$TRIVY_SERVER - $TRIVY_VERSION"
    # Run Trivy security scan with error handling
    - |
      # Check for HIGH severity issues with proper error handling
      ./trivy config --exit-code 0 --severity HIGH $DIR_PATH/ --format json --output ${TRIVY_REPORT_FILE}
      # Check for CRITICAL severity issues with proper error handling
      ./trivy config --exit-code 1 --severity CRITICAL $DIR_PATH/ --format json --output ${TRIVY_REPORT_FILE}
    - echo "done Scan Dockerfile !"
  tags:
    - docker
  artifacts:
    when: always
    paths:
      - ${TRIVY_REPORT_FILE}

.defectdojo_upload:
  image: $DOCKER_REG_LOCAL_URL/base/alpine:git-3.21
  stage: test
  before_script:
    - apk add --no-cache bash curl jq
  script:
    - |
      set -euo pipefail

      # Enhanced validation with URL encoding
      validate_vars() {
        required_vars=(
          DEFECTDOJO_URL DEFECTDOJO_API_KEY 
          CI_PROJECT_NAME DEFECTDOJO_DEPT 
          ENGAGEMENT_NAME DEFECTDOJO_SCAN_TYPE
          DEFECTDOJO_SCAN_TEST_TYPE DEFECTDOJO_SCAN_FILE
        )
        
        for var in "${required_vars[@]}"; do
          [ -n "${!var:-}" ] || { echo "❌ $var not set" >&2; exit 1; }
        done
        [ -f "${DEFECTDOJO_SCAN_FILE}" ] || { echo "❌ Scan file missing"; exit 1; }
      }

      # Improved API handler with error trapping
      api_request() {
        local method=${1:-GET}
        local url="$2"
        local data="${3:-}"
        local response headers status body
        
        exec 3>&1
        response=$(curl -sS -w "\n%{http_code}" -X "$method" \
          -H "Authorization: Token ${DEFECTDOJO_API_KEY}" \
          ${data:+-H "Content-Type: application/json" -d "$data"} \
          "$url" | tee /dev/fd/3)
        
        status=${response##*$'\n'}
        body=${response%$'\n'*}
        
        if [ $status -ge 400 ]; then
          echo "API Error: $method $url" >&2
          jq -r '.detail // .' <<< "$body" >&2
          return 1
        fi
        echo "$body"
      }

      # Unified resource management
      manage_resource() {
        local resource=$1 query=$2 create_data=$3
        local encoded_query=$(curl -sSG --data-urlencode "$query" --write-out '%{url}\n' /dev/null | cut -d'?' -f2)
        
        echo "🔍 Checking $resource..."
        local response=$(api_request GET "${DEFECTDOJO_URL}/api/v2/${resource}/?${encoded_query}") || exit $?
        
        if [ $(jq -r '.count' <<< "$response") -gt 0 ]; then
          local id=$(jq -r '.results[0].id' <<< "$response")
          echo "✅ Existing $resource ID: $id"
        else
          echo "📝 Creating new $resource..."
          response=$(api_request POST "${DEFECTDOJO_URL}/api/v2/${resource}/" "$create_data") || exit $?
          id=$(jq -r '.id' <<< "$response")
          echo "✅ Created $resource ID: $id"
        fi
        eval "export ${resource^^}_ID=$id"
      }

      # Main execution
      validate_vars

      manage_resource "product_types" "name=${DEFECTDOJO_DEPT}" \
        "$(jq -n --arg name "$DEFECTDOJO_DEPT" \
          '{name: $name, description: "Auto-created product type"}')"

      manage_resource "products" "name=${CI_PROJECT_NAME}" \
        "$(jq -n --arg name "$CI_PROJECT_NAME" --arg pt "$PRODUCT_TYPE_ID" \
          '{name: $name, prod_type: $pt, description: "Auto-created product"}')"

      engagement_settings() {
        jq -n --arg name "$ENGAGEMENT_NAME" --arg product "$PRODUCT_ID" \
          --arg ts "$(date +%Y-%m-%d)" --arg te "$(date -d "+${DEFECTDOJO_ENGAGEMENT_PERIOD:-30} days" +%Y-%m-%d)" \
          --argjson dedup "${DEFECTDOJO_ENGAGEMENT_DEDUPLICATION_ON_ENGAGEMENT:-true}" \
          --argjson threat "${DEFECTDOJO_ENGAGEMENT_THREAT_MODEL:-false}" \
          --argjson api "${DEFECTDOJO_ENGAGEMENT_API_TEST:-false}" \
          --argjson pen "${DEFECTDOJO_ENGAGEMENT_PEN_TEST:-false}" \
          --argjson check "${DEFECTDOJO_ENGAGEMENT_CHECK_LIST:-false}" \
          '{name: $name, product: $product, target_start: $ts, target_end: $te,
            status: "In Progress", deduplication_on_engagement: $dedup,
            threat_model: $threat, api_test: $api, pen_test: $pen, check_list: $check}'
      }

      manage_resource "engagements" "product=${PRODUCT_ID}&name=${ENGAGEMENT_NAME}" "$(engagement_settings)"

      echo "📤 Uploading scan report..."
      upload_response=$(api_request POST "${DEFECTDOJO_URL}/api/v2/reimport-scan/" \
        -F "file=@${DEFECTDOJO_SCAN_FILE}" \
        -F "scan_date=$(date +%Y-%m-%d)" \
        -F "engagement=${ENGAGEMENT_ID}" \
        -F "scan_type=${DEFECTDOJO_SCAN_TYPE}" \
        -F "test_type=${DEFECTDOJO_SCAN_TEST_TYPE}" \
        -F "close_old_findings=true" \
        -F "verified=true") || exit $?

      echo "✅ Upload successful"
      jq -r '.status, .message' <<< "$upload_response"

  tags: [docker]