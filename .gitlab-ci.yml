image: $DOCKER_REG_LOCAL_URL/base/docker:20.10.7-bash-jq
stages:
  - test
  - build
  - deploy
############
include: 'deploy-vars.gitlab-ci.yml'
#include: 'service-tools.gitlab-ci.yml'
###########
variables:
  RULES_CHANGES_PATH: "**/*"
.base-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes: 
        - $RULES_CHANGES_PATH
.test: &test
  stage: test
  script:
    - echo "test - $CI_ENVIRONMENT_NAME"
    - docker login -u $docker_reg_user -p $docker_reg_pass $docker_reg_url
    - echo "[$ORG] [$CI_ENVIRONMENT_NAME] - Testing is DONE!";
  tags:
    - docker

.build: &build
  stage: build
  script:
    - echo "build - $CI_ENVIRONMENT_NAME"
    - echo "docker build --no-cache --build-arg base_img="$base_img" --build-arg packages="$packages" -f Dockerfile -t hub.nexdev.net/$base_img ."
    - echo "[$ORG] [$CI_ENVIRONMENT_NAME] - Build is DONE!";
  tags:
    - docker

.deploy: &deploy
  stage: deploy
  script:
    - echo "Push - $CI_ENVIRONMENT_NAME"
    - echo "[$ORG] [$CI_ENVIRONMENT_NAME] - deploy is DONE!";
  tags:
    - docker

#base_img: "haproxy/haproxy-ubuntu:2.6"
#packages: "nano curl telnet"

.haproxy:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "haproxy/**/*"


haproxy-test:
  extends: .haproxy
  <<: *test

haproxy-build:
  extends: .haproxy
  needs: ["haproxy-test"]
  <<: *build

haproxy-deploy:
  extends: .haproxy
  needs: ["haproxy-build"]
  <<: *deploy
