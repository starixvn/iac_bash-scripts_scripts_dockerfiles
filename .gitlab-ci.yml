image: $DOCKER_REG_LOCAL_URL/base/docker:20.10.7-bash-jq
stages:
  - test
  - build
  - deploy
############
include: 'deploy-vars.gitlab-ci.yml'
###########
variables:
  RULES_CHANGES_PATH: "**/*"
.base-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes: 
        - $RULES_CHANGES_PATH
.test: &test
  stage: test
  script:
    - echo "test - $CI_ENVIRONMENT_NAME"
    - docker login -u $docker_reg_user -p $docker_reg_pass $docker_reg_url
    - echo "[$ORG] [$CI_ENVIRONMENT_NAME] - Testing is DONE!";
  tags:
    - docker

.build: &build
  stage: build
  script:
    - echo "build - $CI_ENVIRONMENT_NAME"
    - echo "[$ORG] [$CI_ENVIRONMENT_NAME] - Build is DONE!";
  tags:
    - docker

.deploy: &deploy
  stage: deploy
  script:
    - echo "Push - $CI_ENVIRONMENT_NAME"
    - echo "[$ORG] [$CI_ENVIRONMENT_NAME] - deploy is DONE!";
  tags:
    - docker

##HA-PROXY-TOOL
.ha-proxy:
  extends: .base-rules
  variables:
      RULES_CHANGES_PATH: "haproxy/**/*"
      PROJECT: HA-PROXY

ha-proxy-test:
  extends: .ha-proxy
  <<: *test

ha-proxy-build:
  extends: .ha-proxy
  needs: ["ha-proxy-test"]
  <<: *build

ha-proxy-deploy:
  extends: .ha-proxy
  needs: ["ha-proxy-build"]
  <<: *deploy
