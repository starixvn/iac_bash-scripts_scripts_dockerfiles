stages:
  - test
############
include:
  - local: "base.yml"
  - local: "/alpine/ci.yml"
#  - local: "/awx-runner/ci.yml"
#  - local: "/awx-web/ci.yml"

.test:
  stage: test
  variables:
    TRIVY_REPORT_FILE: "trivy-report.json"
  script:
    # Download and extract Trivy scanner
    - wget --no-verbose https://gitlab.nexdev.net/NEXOPS/tools/trivy-scan/-/raw/main/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz?inline=false -O - | tar -zxvf -
    # Display Dockerfile contents  
    - cat $DIR_PATH/Dockerfile
    # Log Trivy version and server info
    - echo "$TRIVY_SERVER - $TRIVY_VERSION"
    # Run Trivy security scan with error handling
    - |
      # Check for HIGH severity issues with proper error handling
      ./trivy config --exit-code 0 --severity HIGH $DIR_PATH/ --format json --output ${TRIVY_REPORT_FILE}
      # Check for CRITICAL severity issues with proper error handling
      ./trivy config --exit-code 1 --severity CRITICAL $DIR_PATH/ --format json --output ${TRIVY_REPORT_FILE}
    - echo "done Scan Dockerfile !"
  tags:
    - docker
  artifacts:
    when: always
    paths:
      - ${TRIVY_REPORT_FILE}

.defectdojo_upload:
  image: $DOCKER_REG_LOCAL_URL/base/alpine:git-3.21
  stage: test
  tags:
    - docker
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      set -eo pipefail

      # List of required variables (POSIX sh)
      REQUIRED_VARS="\
        DEFECTDOJO_URL \
        DEFECTDOJO_API_KEY \
        CI_PROJECT_NAME \
        DEFECTDOJO_DEPT \
        ENGAGEMENT_NAME \
        DEFECTDOJO_SCAN_FILE \
        DEFECTDOJO_SCAN_TYPE \
        DEFECTDOJO_SCAN_TEST_TYPE\
        "

      validate_env() {
        for var in $REQUIRED_VARS; do
          if [ -z "${!var:-}" ]; then
            echo "❌ Error: $var is not set" >&2
            exit 1
          fi
        done

        if [ ! -f "$DEFECTDOJO_SCAN_FILE" ]; then
          echo "❌ Scan file $DEFECTDOJO_SCAN_FILE not found" >&2
          exit 1
        fi
      }

      api_call() {
        method=$1; endpoint=$2; data=${3:-}
        response=$(curl -sS -w "\n%{http_code}" -X "$method" \
          -H "Authorization: Token $DEFECTDOJO_API_KEY" \
          ${data:+-H "Content-Type: application/json" -d "$data"} \
          "$DEFECTDOJO_URL/api/v2/$endpoint")
        status_code=$(printf "%s" "$response" | tail -n1)
        body=$(printf "%s" "$response" | sed '$d')
        if [ "$status_code" -ge 400 ]; then
          echo "❌ API Error ($status_code): ${body:-No response body}" >&2
          exit 1
        fi
        printf "%s" "$body"
      }

      manage_resource() {
        resource=$1; query=$2; create_data=$3
        result=$(api_call GET "${resource}/?$query")
        count=$(printf "%s" "$result" | jq -r '.count')
        if [ "$count" -gt 0 ]; then
          id=$(printf "%s" "$result" | jq -r '.results[0].id')
          echo "✅ Existing $resource found: $id"
        else
          echo "📝 Creating new $resource..."
          result=$(api_call POST "${resource}/" "$create_data")
          id=$(printf "%s" "$result" | jq -r '.id')
          echo "✅ Created $resource: $id"
        fi
        # Export ID variable
        eval "export $(echo $resource | tr a-z A-Z)_ID=$id"
      }

      validate_env

      manage_resource product_types "name=$DEFECTDOJO_DEPT" \
        "$(jq -n --arg name "$DEFECTDOJO_DEPT" \
          '{name: $name, description: "Auto-created product type"}')"

      manage_resource products "name=$CI_PROJECT_NAME" \
        "$(jq -n --arg name "$CI_PROJECT_NAME" --arg pt "$PRODUCT_TYPE_ID" \
          '{name: $name, prod_type: $pt, description: "Auto-created product"}')"

      engagement_payload() {
        jq -n \
          --arg name "$ENGAGEMENT_NAME" \
          --arg product "$PRODUCT_ID" \
          --arg start "$(date +%Y-%m-%d)" \
          --arg end "$(date -d "+${DEFECTDOJO_ENGAGEMENT_PERIOD:-30} days" +%Y-%m-%d)" \
          --argjson dedup "${DEFECTDOJO_ENGAGEMENT_DEDUPLICATION_ON_ENGAGEMENT:-true}" \
          '{name: $name, product: $product,
            target_start: $start, target_end: $end,
            status: "In Progress", deduplication_on_engagement: $dedup,
            threat_model: false, api_test: false, pen_test: false, check_list: false}'
      }

      manage_resource engagements "product=$PRODUCT_ID&name=$ENGAGEMENT_NAME" \
        "$(engagement_payload)"

      echo "📤 Uploading scan report..."
      upload_response=$(curl -sS -X POST "$DEFECTDOJO_URL/api/v2/reimport-scan/" \
        -H "Authorization: Token $DEFECTDOJO_API_KEY" \
        -F "file=@$DEFECTDOJO_SCAN_FILE" \
        -F "scan_date=$(date +%Y-%m-%d)" \
        -F "engagement=$ENGAGEMENT_ID" \
        -F "scan_type=$DEFECTDOJO_SCAN_TYPE" \
        -F "test_type=$DEFECTDOJO_SCAN_TEST_TYPE" \
        -F "close_old_findings=true" \
        -F "verified=true")

      if printf "%s" "$upload_response" | jq -e '.success' >/dev/null; then
        echo "✅ Upload successful"
        printf "%s\n" "$upload_response" | jq -r '.message'
      else
        echo "❌ Upload failed: $(printf "%s" "$upload_response" | jq -r '.message')" >&2
        exit 1
      fi
