.dotnetcore6-s1:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "dotnetcore6-s1/**/*"
    DIR_PATH: "dotnetcore6-s1"
    # IMAGE_VERSION: "6.0-alpine-iculibs"
    IMAGE_VERSION: "6.0-alpine-s1"
    IMAGE_TAG: "6.0-alpine"
    BASE_IMAGE: "mcr.microsoft.com/dotnet/aspnet:$IMAGE_TAG"
    # IMAGE_PATH: "rebuild-baseimage/dotnetcore/aspnet:$IMAGE_VERSION"
    IMAGE_PATH: "base/dotnet/core/aspnet:$IMAGE_VERSION"

dotnetcore6-s1-test:
  extends: [.dotnetcore6-s1, .test]

dotnetcore6-s1-build:
  extends: [.dotnetcore6-s1, .build]
  needs: ["dotnetcore6-s1-test"]

dotnetcore6-s1-config-scan-reports:
  extends: [.defectdojo_upload, .dotnetcore6-s1]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Config Scan"
  needs:
    - job: dotnetcore6-s1-test
      artifacts: true
  when: always


dotnetcore6-s1-image-scan-reports:
  extends: [.defectdojo_upload, .dotnetcore6-s1]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Image Scan"
  needs:
    - job: dotnetcore6-s1-build
      artifacts: true
  when: always