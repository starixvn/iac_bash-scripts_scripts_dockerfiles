.dotnetsdknodejs:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "dotnet-sdk-nodejs-alpine/**/*"
    DIR_PATH: "dotnet-sdk-nodejs-alpine"
    IMAGE_VERSION: "8.0-node22-25h1"
    BASE_IMAGE: "mcr.microsoft.com/dotnet/sdk:8.0-alpine"
    IMAGE_PATH: "base/dotnet/core/sdk:$IMAGE_VERSION"

dotnetsdknodejs-test:
  extends: [.dotnetsdknodejs, .test]

dotnetsdknodejs-build:
  extends: [.dotnetsdknodejs, .build]
  needs: ["dotnetsdknodejs-test"]


dotnetsdknodejs-config-scan-reports:
  extends: [.defectdojo_upload, .dotnetsdknodejs]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "Dockerfile Scan"
  needs:
    - job: dotnetsdknodejs-test
      artifacts: true
  when: always


dotnetsdknodejs-image-scan-reports:
  extends: [.defectdojo_upload, .dotnetsdknodejs]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$IMAGE_PATH - Image Scan"
  needs:
    - job: dotnetsdknodejs-build
      artifacts: true
  when: always