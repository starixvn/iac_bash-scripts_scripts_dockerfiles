.axosyslog:
  # extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "axosyslog/**/*"
    DIR_PATH: "axosyslog"
    IMAGE_VERSION: "4.8.0"
    BASE_IMAGE: "ghcr.io/axoflow/axosyslog:4.8.0"
    IMAGE_PATH: "base/nexops-tools/logging/axosyslog:$IMAGE_VERSION"

axosyslog-test:
  extends: [.axosyslog, .test]

axosyslog-reports:
  extends: [.defectdojo_upload, .axosyslog]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "trivy-report.json"
    DEFECTDOJO_SCAN_TYPE: "$DIR_PATH (Trivy Scan)"
    DEFECTDOJO_SCAN_TEST_TYPE: "GitLab-CI Trivy Scan"
  needs:
    - job: axosyslog-test
      artifacts: true
  when: always
