.dotnetcore7-slim:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "dotnetcore7-slim/**/*"
    DIR_PATH: "dotnetcore7-slim"
    IMAGE_VERSION: "7.0-slim"
    IMAGE_TAG: "7.0-bullseye-slim"
    BASE_IMAGE: "mcr.microsoft.com/dotnet/aspnet:$IMAGE_TAG"
    IMAGE_PATH: "base/dotnet/core/aspnet:$IMAGE_VERSION"

dotnetcore7-slim-test:
  extends: [.dotnetcore7-slim, .test]

dotnetcore7-slim-build:
  extends: [.dotnetcore7-slim, .build]
  needs: ["dotnetcore7-slim-test"]

dotnetcore7-slim-config-scan-reports:
  extends: [.defectdojo_upload, .dotnetcore7-slim]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Config Scan "
  needs:
    - job: dotnetcore7-slim-test
      artifacts: true
  when: always


dotnetcore7-slim-image-scan-reports:
  extends: [.defectdojo_upload, .dotnetcore7-slim]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Image Scan "
  needs:
    - job: dotnetcore7-slim-build
      artifacts: true
  when: always