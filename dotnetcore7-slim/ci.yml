.dotnetcore7-slim:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "dotnetcore7-slim/**/*"
    DIR_PATH: "dotnetcore7-slim"
    IMAGE_VERSION: "7.0-slim"
    IMAGE_TAG: "7.0-bullseye-slim"
    BASE_IMAGE: "mcr.microsoft.com/dotnet/aspnet:$IMAGE_TAG"
    IMAGE_PATH: "base/dotnet/core/aspnet:$IMAGE_VERSION"

dotnetcore7-slim-test:
  extends: [.dotnetcore7-slim, .test]

dotnetcore7-slim-build:
  extends: [.dotnetcore7-slim, .build]
  needs: ["dotnetcore7-slim-test"]

