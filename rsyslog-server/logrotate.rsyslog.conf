/logs/*/*.log
{
    rotate 3
    maxsize 1G
    daily
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts
    postrotate
        /usr/lib/rsyslog/rsyslog-rotate
    endscript
}

/logs/*/dockerd.log {
    size 1G
    missingok
    notifempty
    rotate 3
    compress
    copytruncate
    postrotate
        /usr/lib/rsyslog/rsyslog-rotate
    endscript
}