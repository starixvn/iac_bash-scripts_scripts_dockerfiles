.jaeger-elasticsearch:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "jaeger-elasticsearch/**/*"
    DIR_PATH: "jaeger-elasticsearch"
    BASE_IMAGE: "hub.lumigame.com/base/nexops-tools/jaeger/elasticsearch:7.17.0"
    IMAGE_VERSION: "7.17.0-test"
    IMAGE_PATH: "base/nexops-tools/jaeger/elasticsearch:$IMAGE_VERSION"

jaeger-elasticsearch-test:
  extends: [.jaeger-elasticsearch, .test]

jaeger-elasticsearch-build:
  extends: [.jaeger-elasticsearch, .build]
  needs: ["jaeger-elasticsearch-test"]