.docker:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "docker/**/*"
    DIR_PATH: "docker"
    IMAGE_VERSION: "24.0.7"
    BASE_IMAGE: "docker:git"
    IMAGE_PATH: "rebuild-baseimage/docker:$IMAGE_VERSION"

docker-test:
  extends: [.docker, .test]

docker-build:
  extends: [.docker, .build]
  needs: ["docker-test"]

