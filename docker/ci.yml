.docker:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "docker/**/*"
    DIR_PATH: "docker"
    IMAGE_VERSION: "26.0.0-alpine3.19"
    BASE_IMAGE: "docker:26.0.0-alpine3.19"
    IMAGE_PATH: "rebuild-baseimage/docker:$IMAGE_VERSION"

docker-test:
  extends: [.docker, .test]

docker-build:
  extends: [.docker, .build]
  needs: ["docker-test"]

docker-config-scan-reports:
  extends: [.defectdojo_upload, .docker]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Config Scan"
  needs:
    - job: docker-test
      artifacts: true
  when: always


docker-image-scan-reports:
  extends: [.defectdojo_upload, .docker]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$ENGAGEMENT_NAME - Image Scan"
  needs:
    - job: alpine-build
      artifacts: true
  when: always

