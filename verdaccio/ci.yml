.verdaccio:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "verdaccio/**/*"
    DIR_PATH: "verdaccio"
    BASE_IMAGE: "verdaccio/verdaccio:$IMAGE_VERSION"
    IMAGE_VERSION: "5.24.1"
    IMAGE_PATH: "base/nexops-tools/verdaccio:$IMAGE_VERSION"

verdaccio-test:
  extends: [.verdaccio, .test]

verdaccio-build:
  extends: [.verdaccio, .build]
  needs: ["verdaccio-test"]

verdaccio-config-scan-reports:
  extends: [.defectdojo_upload, .verdaccio]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$CONFIG_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "Dockerfile Scan"
  needs:
    - job: verdaccio-test
      artifacts: true
  when: always


verdaccio-image-scan-reports:
  extends: [.defectdojo_upload, .verdaccio]
  variables:
    ENGAGEMENT_NAME: "$DIR_PATH"
    DEFECTDOJO_SCAN_FILE: "$IMAGE_SCAN_REPORT"
    DEFECTDOJO_SCAN_TYPE: "Trivy Scan"
    DEFECTDOJO_SCAN_TEST_TYPE: "Trivy Scan"
    DEFECTDOJO_TEST_TITLE: "$IMAGE_PATH - Image Scan"
  needs:
    - job: verdaccio-build
      artifacts: true
  when: always