.docker-alpine:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "docker-alpine/**/*"
    DIR_PATH: "docker-alpine"
    IMAGE_VERSION: "24.0.4-bash-jq-jinja"
    BASE_IMAGE: "docker:24.0.4-cli-alpine3.18"
    IMAGE_PATH: "base/docker:$IMAGE_VERSION"

docker-alpine-test:
  extends: [.docker-alpine, .test]

docker-alpine-build:
  extends: [.docker-alpine, .build]
  needs: ["docker-alpine-test"]

